@import url('https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;0,900;1,300;1,400&display=swap');

/* ===== CSS VARIABLES ===== */
:root {
  --color-primary: #F96500;
  --color-primary-dark: #d95500;
  --color-bg-dark: #0D0D0D;
  --color-bg-dark2: #151616;
  --color-bg-light: #F7F9FC;
  --color-text: #33373D;
  --color-text-secondary: #69727D;
  --color-border: #CBD0DA;
  --font-title: 'Source Sans 3', sans-serif;
  --font-body: 'Source Sans 3', sans-serif;
  --radius-btn: 50px;
  --transition: 0.3s ease;
}

/* ===== RESET ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body { font-family: var(--font-body); color: var(--color-text); overflow-x: hidden; }
a { text-decoration: none; color: inherit; }
ul { list-style: none; }
img { display: block; max-width: 100%; }
button { border: none; cursor: pointer; font-family: var(--font-body); }

/* ===== UTILS ===== */
.container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
.badge {
  display: inline-flex; align-items: center; gap: 8px;
  font-family: var(--font-title); font-size: 11px; font-weight: 700;
  letter-spacing: 2.5px; text-transform: uppercase; color: var(--color-primary);
  margin-bottom: 16px;
}
.badge::before { content: '●'; font-size: 8px; }

.btn-primary {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--color-primary); color: #fff;
  font-family: var(--font-title); font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 16px 32px; border-radius: var(--radius-btn);
  cursor: pointer; transition: var(--transition);
  border: 2px solid var(--color-primary);
  white-space: nowrap;
}
.btn-primary:hover { background: var(--color-primary-dark); border-color: var(--color-primary-dark); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(249,101,0,0.35); }

.btn-secondary {
  display: inline-flex; align-items: center; gap: 10px;
  background: transparent; color: #fff;
  font-family: var(--font-title); font-size: 12px; font-weight: 700;
  letter-spacing: 2px; text-transform: uppercase;
  padding: 16px 32px; border-radius: var(--radius-btn);
  cursor: pointer; transition: var(--transition);
  border: 2px solid rgba(255,255,255,0.5);
  white-space: nowrap;
}
.btn-secondary:hover { border-color: #fff; transform: translateY(-2px); }

/* ===== ANIMATIONS ===== */
.reveal {
  opacity: 0;
  transform: translateY(30px);
  transition: opacity 0.7s ease, transform 0.7s ease;
}
.reveal.visible { opacity: 1; transform: translateY(0); }
.reveal-delay-1 { transition-delay: 0.1s; }
.reveal-delay-2 { transition-delay: 0.2s; }
.reveal-delay-3 { transition-delay: 0.3s; }
.reveal-delay-4 { transition-delay: 0.4s; }
.reveal-delay-5 { transition-delay: 0.5s; }
